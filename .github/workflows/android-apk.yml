name: Build Shakti Hero 3D Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Game Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          echo "Checking Android SDK..."
          test -d "$ANDROID_HOME"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f | head -1)

          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager not found."
            exit 1
          fi

          echo "SDK Manager found: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android Licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f | head -1)

          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android Packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f | head -1)

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Download Godot
        run: |
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            -O godot.zip

          unzip -oq godot.zip -d godot-bin

          chmod +x \
            godot-bin/Godot_v4.3-stable_linux.x86_64

      - name: Install Export Templates
        run: |
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz \
            -O templates.tpz

          mkdir -p \
            "$HOME/.local/share/godot/export_templates/4.3.stable"

          mkdir -p templates

          unzip -oq templates.tpz -d templates

          cp templates/templates/* \
            "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Verify Game Files
        run: |
          test -f project.godot
          test -f scenes/main.tscn
          test -f scripts/game.gd
          test -f export_presets.cfg

      - name: Configure Godot
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import Game
        run: |
          godot-bin/Godot_v4.3-stable_linux.x86_64 \
            --headless \
            --editor \
            --path . \
            --quit

      - name: Build APK
        run: |
          mkdir -p build

          godot-bin/Godot_v4.3-stable_linux.x86_64 \
            --headless \
            --path . \
            --export-debug "Android" \
            build/ShaktiHero3D.apk

          test -s build/ShaktiHero3D.apk

          ls -lh build/ShaktiHero3D.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShaktiHero3D-Android-APK
          path: build/ShaktiHero3D.apk
          if-no-files-found: error
          retention-days: 7
