name: Build Shakti Hero 3D Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          yes | sdkmanager --licenses || true

      - name: Extract Game Project
        run: |
          if [ ! -f ShaktiHero3D_Complete_Project.zip ]; then
            echo "Game ZIP file not found!"
            exit 1
          fi

          mkdir -p game-project

          unzip -oq ShaktiHero3D_Complete_Project.zip \
            -d game-project

          echo "Extracted project files:"
          find game-project -maxdepth 3 -type f

      - name: Verify Game Files
        run: |
          test -f game-project/project.godot
          test -f game-project/scenes/main.tscn
          test -f game-project/scripts/game.gd
          test -f game-project/export_presets.cfg

      - name: Download Godot 4.3
        run: |
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            -O godot.zip

          unzip -oq godot.zip -d godot-bin

          chmod +x \
            godot-bin/Godot_v4.3-stable_linux.x86_64

      - name: Install Godot Export Templates
        run: |
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz \
            -O templates.tpz

          mkdir -p \
            "$HOME/.local/share/godot/export_templates/4.3.stable"

          mkdir -p templates

          unzip -oq templates.tpz -d templates

          cp templates/templates/* \
            "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Configure Godot Android SDK
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import Game Resources
        run: |
          godot-bin/Godot_v4.3-stable_linux.x86_64 \
            --headless \
            --editor \
            --path game-project \
            --quit

      - name: Build Android APK
        run: |
          mkdir -p build

          godot-bin/Godot_v4.3-stable_linux.x86_64 \
            --headless \
            --path game-project \
            --export-debug "Android" \
            build/ShaktiHero3D.apk

          test -s build/ShaktiHero3D.apk

          ls -lh build/ShaktiHero3D.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShaktiHero3D-Android-APK
          path: build/ShaktiHero3D.apk
          if-no-files-found: error
          retention-days: 7
